name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Each week's project lives in its own folder.
defaults:
  run:
    working-directory: WEEK 0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WEEK 0/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx jest
      - run: npx expo prebuild --platform android --no-install
      # Real phones only, which keeps the APK small. ponytail: signed with the template's debug key; add a release keystore secret before a store listing.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: WEEK 0/android
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk codeforces-buddy-${GITHUB_REF_NAME}.apk
          gh release create "$GITHUB_REF_NAME" codeforces-buddy-${GITHUB_REF_NAME}.apk --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
